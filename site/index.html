<title>每日讀經</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%238b2500'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='white' font-family='sans-serif'%3E經%3C/text%3E%3C/svg%3E">

<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <button id="prev" class="nav" aria-label="前一日">‹</button>
  <button id="today" class="date" title="回到今日"><span id="dateText">…</span></button>
  <button id="next" class="nav" aria-label="後一日">›</button>
</header>
<nav class="tools">
  <button id="tRuby" class="tog" aria-pressed="true">Yale</button>
  <button id="tEn" class="tog" aria-pressed="true">EN</button>
  <button id="tLa" class="tog" aria-pressed="false">LA</button>
  <button id="tProp" class="tog" aria-pressed="false" title="進堂詠、集禱經、獻禮經、領主詠、領聖體後經">禱文</button>
  <span class="sp"></span>
  <button id="sizeDown" class="tog" aria-label="縮小">A−</button>
  <button id="sizeUp" class="tog" aria-label="放大">A+</button>
</nav>
<main id="main"><p class="muted">載入中…</p></main>
<footer class="foot">
  <span id="src"></span>
</footer>
<script src="app.js"></script>
</body>
</html>
