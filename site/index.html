<!doctype html>
<html lang="zh-HK" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="google" content="notranslate">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fdfcfa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131210" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="讀經">
<title>每日讀經</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Source+Sans+3:wght@500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <button id="prev" class="nav" aria-label="前一日">‹</button>
  <button id="today" class="date" title="回到今日"><span id="dateText">…</span></button>
  <button id="next" class="nav" aria-label="後一日">›</button>
</header>
<nav class="tools">
  <button id="tRuby" aria-pressed="true" title="耶魯粵語拼音"><span class="coin"><span class="glyph">粵<small>YALE</small></span></span></button>
  <button id="tEn" aria-pressed="true" title="English"><span class="coin"><svg viewBox="0 0 60 36" aria-hidden="true"><rect width="60" height="36" fill="#1b3a8a"/><path d="M0 0l60 36M60 0L0 36" stroke="#fff" stroke-width="7"/><path d="M0 0l60 36M60 0L0 36" stroke="#c8102e" stroke-width="2.5"/><path d="M30 0v36M0 18h60" stroke="#fff" stroke-width="11"/><path d="M30 0v36M0 18h60" stroke="#c8102e" stroke-width="6"/></svg></span></button>
  <button id="tLa" aria-pressed="false" title="Latine"><span class="coin"><svg viewBox="0 0 36 36" aria-hidden="true"><rect width="18" height="36" fill="#f1c232"/><rect x="18" width="18" height="36" fill="#fff"/><g transform="translate(27 18)" fill="none" stroke-linecap="round"><g stroke="#b8860b" stroke-width="2.2"><path d="M-5 5l9-9"/><path d="M4-4l1.6 1.6M1.8-1.8L3.4-.2"/></g><g stroke="#8f8f8f" stroke-width="2.2"><path d="M5 5l-9-9"/><path d="M-4-4l-1.6 1.6M-1.8-1.8L-3.4-.2"/></g><circle cx="-5.6" cy="5.6" r="2.3" stroke="#b8860b" stroke-width="2"/><circle cx="5.6" cy="5.6" r="2.3" stroke="#8f8f8f" stroke-width="2"/></g></svg></span></button>
  <button id="tProp" aria-pressed="false" title="進堂詠、集禱經、獻禮經、領主詠、領聖體後經"><span class="pill">禱文</span></button>
  <span class="sp"></span>
  <button id="sizeDown" class="size" aria-label="縮小">A−</button>
  <button id="sizeUp" class="size" aria-label="放大">A+</button>
</nav>
<main id="main"><p class="muted">載入中…</p></main>
<footer class="foot">
  <span id="src"></span>
</footer>
<script src="app.js"></script>
</body>
</html>
