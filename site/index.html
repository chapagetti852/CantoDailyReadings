<!doctype html>
<html lang="zh-HK" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="google" content="notranslate">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fdfcfa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131210" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="讀經">
<title>每日讀經</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Source+Sans+3:wght@500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <button id="prev" class="nav" aria-label="前一日">‹</button>
  <button id="today" class="date" title="回到今日"><span id="dateText">…</span></button>
  <button id="next" class="nav" aria-label="後一日">›</button>
</header>
<nav class="tools">
  <div class="row">
    <button id="tRuby" aria-pressed="true"><span class="coin"><span class="glyph">粵</span></span><span class="cap">Yale</span></button>
    <button id="tRead" class="menu" aria-pressed="true" aria-expanded="false" aria-controls="readOpts"><span class="coin"><span class="glyph">讀</span></span><span class="cap">Readings</span></button>
    <button id="tProp" class="menu" aria-pressed="false" aria-expanded="false" aria-controls="propOpts"><span class="coin"><span class="glyph">禱</span></span><span class="cap">Propers</span></button>
    <span class="sp"></span>
    <button id="tSize" class="menu" aria-pressed="false" aria-expanded="false" aria-controls="sizes"><span class="coin"><span class="glyph aa">Aa</span></span><span class="cap">Size</span></button>
  </div>
  <div class="row opts" id="readOpts" hidden>
    <span class="optlab">讀經</span>
    <button class="chip" id="readZh" aria-pressed="true">中文</button>
    <button class="chip" id="readEn" aria-pressed="true">English</button>
  </div>
  <div class="row opts" id="propOpts" hidden>
    <span class="optlab">禱文</span>
    <button class="chip" id="propZh" aria-pressed="false">中文</button>
    <button class="chip" id="propEn" aria-pressed="false">English</button>
    <button class="chip" id="propLa" aria-pressed="false">Latin</button>
  </div>
  <div class="row sizes" id="sizes" hidden>
    <label><span class="lab">粵拼</span><input id="rtSize" type="range" min="8" max="20" step="1"></label>
    <label><span class="lab">漢字</span><input id="zhSize" type="range" min="15" max="32" step="1"></label>
  </div>
</nav>
<main id="main"><p class="muted">載入中…</p></main>
<footer class="foot">
  <span id="src"></span>
</footer>
<script src="app.js"></script>
</body>
</html>
